<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>燕雲競速排軸器</title>
  <style>
    :root {
      --ink: #0a0b0d;
      --surface: #13151a;
      --elevated: #1a1d24;
      --well: #101218;
      --fg: #eceef2;
      --muted: #9aa0ab;
      --subtle: #6e7480;
      --line: #2a2f3a;
      --accent: #c5cbd6;
      --accent-fg: #0a0b0d;
      --axis: #4f8cff;
      --axis-well: #16233c;
      --basic: #6b4fcf;
      --basic-edge: #8b6fff;
      --phase: #2d3a4f;
      --phase-fg: #c3cddc;
      --danger: #e07a7a;
      --danger-bg: #3a2222;
      --danger-edge: #5a3030;
      --cd: #d4a017;
      --dungeon: #9b1c1c;
      --dungeon-edge: #c23a3a;
      --dungeon-fg: #ffe8e8;
      --r-xs: 4px;
      --r-sm: 8px;
      --r-md: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--ink);
      color: var(--fg);
      font-family: "Microsoft JhengHei", "PingFang TC", "WenQuanYi Zen Hei", "Noto Sans TC", "Segoe UI", system-ui, sans-serif;
    }
    button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    input, select { font-family: inherit; color: var(--fg); }
    body { padding: 20px 16px; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; letter-spacing: -0.02em; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 16px;
    }
    .panel h2 { font-size: 0.875rem; color: var(--muted); font-weight: 500; }
    label, .lbl { font-size: 0.875rem; color: var(--muted); white-space: nowrap; }
    input[type="text"], select {
      height: 36px;
      background: var(--well);
      border: 1px solid var(--line);
      border-radius: var(--r-xs);
      padding: 0 10px;
      font-size: 0.875rem;
      outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: var(--subtle); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .opening { margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; align-items: center; gap: 6px; }
    .btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--accent); color: var(--accent-fg);
      border: none; border-radius: var(--r-xs);
      padding: 0 12px; height: 36px;
      font-size: 0.875rem; font-weight: 500;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn-sm { height: 32px; padding: 0 10px; font-size: 0.75rem; }
    .btn-ghost {
      background: transparent; color: var(--fg);
      border: 1px solid var(--line);
    }
    .btn-danger {
      background: var(--danger-bg); color: var(--danger);
      border: 1px solid var(--danger-edge);
      border-radius: var(--r-xs); padding: 0 12px; height: 36px;
      font-size: 0.875rem; white-space: nowrap;
    }
    .btn-danger:hover { filter: brightness(1.1); }
    .btn-tiny { height: 28px; padding: 0 8px; font-size: 0.75rem; }
    .cd-box, .phase-tool, .axis-editor {
      background: var(--well);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 12px;
    }
    .phase-tool { margin-bottom: 16px; }
    .phase-head, .preview-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 10px;
    }
    .phase-list, .axis-list { display: flex; flex-direction: column; gap: 8px; }
    .phase-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--elevated); border: 1px solid var(--line);
      border-radius: var(--r-xs); padding: 6px 8px;
    }
    .phase-handle {
      cursor: grab; color: var(--muted); user-select: none;
      font-size: 1rem; padding: 2px 4px; flex-shrink: 0;
    }
    .phase-handle:active { cursor: grabbing; }
    .phase-item input { flex: 1; min-width: 0; height: 32px; }
    .phase-meta {
      font-size: 0.7rem; color: var(--subtle); white-space: nowrap;
      max-width: 120px; overflow: hidden; text-overflow: ellipsis;
    }
    .axis-block { display: flex; align-items: stretch; gap: 10px; }
    .axis-editor { flex: 1; min-width: 0; }
    .axis-del { display: flex; align-items: center; flex-shrink: 0; }
    .axis-top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .axis-num {
      width: 44px; text-align: center; font-weight: 700;
      background: var(--axis-well) !important;
      border: 2px solid var(--axis) !important;
    }
    .moves { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1; min-height: 32px; }
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--line); background: var(--elevated);
      border-radius: var(--r-xs); padding: 3px 6px 3px 8px; font-size: 0.75rem;
    }
    .tag.basic { background: var(--basic); border-color: var(--basic-edge); }
    .tag.has-phase { box-shadow: 0 0 0 1px rgba(79,140,255,.7); }
    .tag.drop { box-shadow: 0 0 0 2px var(--axis); }
    .tag button {
      background: none; border: none; color: var(--danger);
      font-size: 0.85rem; line-height: 1; padding: 0 2px;
    }
    .arrow { color: var(--subtle); user-select: none; }
    .picker { display: flex; flex-wrap: wrap; gap: 6px; }
    .picker button {
      background: var(--elevated); border: 1px solid var(--line);
      color: var(--fg); border-radius: var(--r-xs);
      padding: 4px 8px; font-size: 0.75rem;
    }
    .picker button:hover { border-color: var(--accent); }
    .picker button.basic { background: rgba(107,79,207,.4); border-color: var(--basic-edge); }
    .picker button.basic:hover { background: rgba(107,79,207,.7); }
    .picker .custom { border-style: dashed; color: var(--muted); }
    .add-axis { display: flex; justify-content: center; margin-top: 12px; }
    .err { font-size: 0.75rem; color: var(--danger); }
    #preview-root { background: var(--ink); border-radius: 6px; padding: 12px 16px; width: fit-content; max-width: 100%; }
    .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; width: fit-content; }
    .chip {
      border: 1px solid var(--line); background: var(--elevated); color: var(--muted);
      border-radius: var(--r-xs); padding: 4px 8px; font-size: 0.75rem; line-height: 1; white-space: nowrap;
    }
    .chip.dungeon { background: var(--dungeon); border-color: var(--dungeon-edge); color: var(--dungeon-fg); }
    .cd-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
    .cd-count {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); background: var(--elevated);
      border-radius: var(--r-xs); padding: 4px 8px;
    }
    .cd-count svg { color: var(--cd); }
    .cd-num { color: var(--cd); font-size: 11px; font-weight: 700; margin-right: 2px; font-variant-numeric: tabular-nums; }
    .axis-preview { position: relative; margin-bottom: 2px; }
    .combo { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; }
    .basic-group { display: inline-flex; align-items: center; gap: 2px; }
    .p-num {
      min-width: 28px; height: 28px; padding: 0 6px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--axis); color: var(--fg); font-weight: 700; font-size: 0.75rem;
      border-radius: var(--r-xs); flex-shrink: 0;
    }
    .p-move {
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--line); background: var(--elevated); color: var(--fg);
      border-radius: var(--r-xs); padding: 4px 8px; font-size: 0.875rem; font-weight: 500;
      line-height: 1; white-space: nowrap; flex-shrink: 0;
    }
    .p-move.basic { background: var(--basic); border-color: var(--basic-edge); }
    .p-phase {
      position: absolute; left: 0; pointer-events: none; white-space: nowrap;
      background: var(--phase); color: var(--phase-fg); font-size: 11px;
      line-height: 1; padding: 1px 8px; border-radius: var(--r-xs);
    }
    .hint { font-size: 0.8rem; color: var(--subtle); }
    .cd-count-input {
      width: 28px; height: 24px; text-align: center; font-weight: 700; font-size: 0.75rem;
      background: var(--ink); border: 1px solid rgba(212,160,23,.5); color: var(--cd);
      border-radius: 4px; outline: none;
    }
    .cd-count-input:focus { border-color: var(--cd); }
  </style>
</head>
<body>
  <div style="max-width:1400px;margin:0 auto;">
    <h1>燕雲競速排軸器</h1>
    <div class="layout">
      <section class="panel">
        <div class="opening">
          <div class="row" id="metaRow">
            <input id="dungeonName" type="text" placeholder="副本/軸名稱" style="min-width:160px;flex:1" />
            <div class="field"><span class="lbl">天工：</span>
              <select id="tiangong">
                <option value="">選擇</option>
                <option value="純火">純火</option>
                <option value="火毒">火毒</option>
                <option value="純毒">純毒</option>
                <option value="毒火">毒火</option>
              </select>
            </div>
            <div class="field"><span class="lbl">符帖：</span>
              <select id="futie">
                <option value="無">無</option>
                <option value="鬼掣帖">鬼掣帖</option>
                <option value="蝕淵帖">蝕淵帖</option>
                <option value="存煞帖">存煞帖</option>
                <option value="行藏帖">行藏帖</option>
                <option value="懸解帖">懸解帖</option>
                <option value="明鑒帖">明鑒帖</option>
              </select>
            </div>
            <div class="field"><span class="lbl">心法：</span>
              <select id="xinfa">
                <option value="">選擇</option>
                <option value="斷石">斷石</option>
                <option value="春雷">春雷</option>
                <option value="所恨">所恨</option>
              </select>
            </div>
            <span id="customTagFields" class="row"></span>
            <button type="button" class="btn-ghost" id="btnAddTag" style="height:36px;padding:0 10px;font-size:0.75rem;border-style:dashed">+自定標籤</button>
          </div>
          <div class="row">
            <span class="lbl">倒數次數：</span>
            <select id="countdownCount">
              <option value="0">無</option>
              <option value="1">1次</option>
              <option value="2">2次</option>
              <option value="3">3次</option>
              <option value="4">4次</option>
            </select>
          </div>
          <div id="countdownEditor" hidden></div>
        </div>

        <div class="phase-tool">
          <div class="phase-head">
            <span class="lbl">階段（拖到下方招式上，每個招式最多一個）</span>
            <button type="button" class="btn btn-sm" id="btnAddPhase">＋ 新增階段</button>
          </div>
          <div class="phase-list" id="phaseList"></div>
        </div>

        <div class="axis-list" id="rowsContainer"></div>
        <div class="add-axis">
          <button type="button" class="btn" id="btnAddRow">＋ 新增軸</button>
        </div>
      </section>

      <section class="panel">
        <div class="preview-head">
          <h2>即時預覽</h2>
          <div class="row">
            <span class="err" id="exportErr"></span>
            <button type="button" class="btn" id="btnDownload">下載 PNG</button>
          </div>
        </div>
        <div id="preview-root"></div>
      </section>
    </div>
  </div>

  <script>
    const AXIS_MOVES = ["Q","H","L","飛天","掛","龍捲","挑飛","風墻","3連","5連","騎1","騎2","蛤蟆","笛","葉龍","矢1","矢2","短火","長火","5拳","解","鐘","卸","閃"];
    const BASIC_MOVES = new Set(["Q","H","L","飛天","掛"]);
    const COUNTDOWN_MOVES = ["酒","笛","風墻","鵝","鐘","Q"];
    const COUNTDOWN_BASIC = new Set(["Q"]);
    const COUNTDOWN_OPTIONS = [{value:0,label:"無"},{value:1,label:"1次"},{value:2,label:"2次"},{value:3,label:"3次"},{value:4,label:"4次"}];

    const FONT = '600 14px "Microsoft JhengHei","PingFang TC","WenQuanYi Zen Hei","Noto Sans TC",sans-serif';
    const FONT_SM = '500 12px "Microsoft JhengHei","PingFang TC","WenQuanYi Zen Hei","Noto Sans TC",sans-serif';
    const FONT_XS = '700 12px "Microsoft JhengHei","PingFang TC","WenQuanYi Zen Hei","Noto Sans TC",sans-serif';
    const C = {
      fg:"#eceef2", muted:"#9aa0ab", elevated:"#1a1d24", line:"#2a2f3a",
      axis:"#4f8cff", basic:"#6b4fcf", basicEdge:"#8b6fff",
      phase:"#2d3a4f", phaseFg:"#c3cddc", dungeon:"#9b1c1c",
      dungeonEdge:"#c23a3a", dungeonFg:"#ffe8e8", cd:"#d4a017", subtle:"#6e7480"
    };

    let uidN = 1;
    function uid(p){ return p + "-" + (uidN++); }

    const state = {
      opening: { dungeonName:"", countdownCount:0, countdownMoves:[], tiangong:"", futie:"無", xinfa:"", customTags:[] },
      phases: [
        { id:"p-qijie", text:"氣竭" },
        { id:"p-phase2", text:"二階段" },
        { id:"p-blank", text:"" }
      ],
      axes: [
        { id:"ax-1", number:"1", moves:["Q","Q","H","L","掛"] },
        { id:"ax-2", number:"2", moves:["Q","H","L","掛"] },
        { id:"ax-3", number:"3", moves:[] }
      ],
      movePhase: {},
      phaseLocation: {},
      customDraft: {},
      showCustom: {}
    };

    function isBasic(name, set){ return (set || BASIC_MOVES).has(name); }
    function moveKey(axisId, i){ return axisId + ":" + i; }
    function parseKey(k){
      var i = k.lastIndexOf(":");
      return { axisId: k.slice(0,i), moveIndex: Number(k.slice(i+1)) };
    }
    function escapeHtml(t){
      return String(t).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/"/g,""");
    }
    function assignLanes(intervals){
      var ends = [];
      return intervals.map(function(it){
        var right = it.left + it.width;
        for (var i=0;i<ends.length;i++){
          if (it.left >= ends[i] - 0.5){ ends[i] = right; return i; }
        }
        ends.push(right);
        return ends.length - 1;
      });
    }
    function getPhase(id){ return state.phases.find(function(p){ return p.id === id; }); }
    function getAxis(id){ return state.axes.find(function(a){ return a.id === id; }); }

    function locLabel(phaseId){
      var k = state.phaseLocation[phaseId];
      if (!k) return "未放置";
      var p = parseKey(k);
      var axis = getAxis(p.axisId);
      if (!axis || !axis.moves[p.moveIndex]) return "未放置";
      return "軸" + axis.number + " · " + axis.moves[p.moveIndex];
    }

    /* ---------- mutations ---------- */
    function addPhase(){
      state.phases.push({ id: uid("p"), text: "" });
      renderPhases();
    }
    function removePhase(id){
      var loc = state.phaseLocation[id];
      if (loc) delete state.movePhase[loc];
      delete state.phaseLocation[id];
      state.phases = state.phases.filter(function(p){ return p.id !== id; });
      renderPhases(); renderEditor(); renderPreview();
    }
    function setPhaseText(id, text){
      var p = getPhase(id);
      if (p) p.text = text;
      renderPreview();
    }
    function assignPhase(phaseId, axisId, moveIndex){
      var k = moveKey(axisId, moveIndex);
      var oldOnMove = state.movePhase[k];
      if (oldOnMove && oldOnMove !== phaseId) delete state.phaseLocation[oldOnMove];
      var oldLoc = state.phaseLocation[phaseId];
      if (oldLoc) delete state.movePhase[oldLoc];
      state.movePhase[k] = phaseId;
      state.phaseLocation[phaseId] = k;
      renderPhases(); renderEditor(); renderPreview();
    }
    function addAxis(){
      state.axes.push({ id: uid("ax"), number: String(state.axes.length + 1), moves: [] });
      renderEditor(); renderPreview();
    }
    function removeAxis(id){
      var mp = {}, loc = {};
      Object.keys(state.movePhase).forEach(function(k){
        var p = parseKey(k);
        if (p.axisId === id) return;
        mp[k] = state.movePhase[k];
        loc[state.movePhase[k]] = k;
      });
      state.movePhase = mp;
      state.phaseLocation = loc;
      state.axes = state.axes.filter(function(a){ return a.id !== id; });
      renderPhases(); renderEditor(); renderPreview();
    }
    function addMove(axisId, name){
      getAxis(axisId).moves.push(name);
      renderEditor(); renderPreview();
    }
    function removeMove(axisId, moveIndex){
      var mp = {}, loc = {};
      Object.keys(state.movePhase).forEach(function(k){
        var p = parseKey(k);
        if (p.axisId !== axisId){ mp[k] = state.movePhase[k]; loc[state.movePhase[k]] = k; return; }
        if (p.moveIndex === moveIndex) return;
        var nm = p.moveIndex > moveIndex ? p.moveIndex - 1 : p.moveIndex;
        var nk = moveKey(axisId, nm);
        mp[nk] = state.movePhase[k];
        loc[state.movePhase[k]] = nk;
      });
      state.movePhase = mp;
      state.phaseLocation = loc;
      getAxis(axisId).moves.splice(moveIndex, 1);
      renderPhases(); renderEditor(); renderPreview();
    }
    function addCountdownMove(name){
      state.opening.countdownMoves = state.opening.countdownMoves.map(function(m){
        var n = parseInt(m.count, 10);
        return { name: m.name, count: Number.isFinite(n) ? String(n+1) : m.count };
      });
      state.opening.countdownMoves.push({ name: name, count: "1" });
      renderCountdown(); renderPreview();
    }
    function removeCountdownMove(i){
      state.opening.countdownMoves.splice(i, 1);
      renderCountdown(); renderPreview();
    }

    /* ---------- render ---------- */
    function renderCountdown(){
      var box = document.getElementById("countdownEditor");
      var n = state.opening.countdownCount;
      if (n <= 0){ box.hidden = true; box.innerHTML = ""; return; }
      box.hidden = false;
      var html = '<div class="cd-box"><div class="moves" style="margin-bottom:8px">';
      if (!state.opening.countdownMoves.length){
        html += '<span class="hint">尚未新增倒數招式</span>';
      } else {
        state.opening.countdownMoves.forEach(function(m, i){
          html += '<span class="tag ' + (isBasic(m.name, COUNTDOWN_BASIC) ? "basic" : "") + '">' +
            '<input class="cd-count-input" data-cd="' + i + '" value="' + escapeHtml(m.count) + '" title="可自行修改倒數數字" />' +
            escapeHtml(m.name) +
            '<button type="button" data-rmcd="' + i + '">×</button></span>';
        });
      }
      html += '</div><div class="picker">';
      COUNTDOWN_MOVES.forEach(function(opt){
        html += '<button type="button" class="' + (isBasic(opt, COUNTDOWN_BASIC) ? "basic" : "") + '" data-addcd="' + opt + '">' + opt + "</button>";
      });
      html += "</div></div>";
      box.innerHTML = html;
    }

    function renderPhases(){
      var list = document.getElementById("phaseList");
      list.innerHTML = "";
      if (!state.phases.length){
        list.innerHTML = '<div class="hint">尚未新增階段</div>';
        return;
      }
      state.phases.forEach(function(p){
        var item = document.createElement("div");
        item.className = "phase-item";
        var handle = document.createElement("span");
        handle.className = "phase-handle";
        handle.draggable = true;
        handle.title = "拖到招式上";
        handle.textContent = "✥";
        handle.addEventListener("dragstart", function(e){
          e.dataTransfer.setData("text/plain", p.id);
          e.dataTransfer.effectAllowed = "move";
        });
        var input = document.createElement("input");
        input.type = "text";
        input.value = p.text;
        input.placeholder = "例如 氣竭、二階段";
        input.addEventListener("input", function(){ setPhaseText(p.id, input.value); });
        var meta = document.createElement("span");
        meta.className = "phase-meta";
        meta.title = locLabel(p.id);
        meta.textContent = locLabel(p.id);
        var del = document.createElement("button");
        del.type = "button";
        del.className = "btn-danger btn-tiny";
        del.textContent = "刪";
        del.addEventListener("click", function(){ removePhase(p.id); });
        item.appendChild(handle); item.appendChild(input); item.appendChild(meta); item.appendChild(del);
        list.appendChild(item);
      });
    }

    function renderEditor(){
      var container = document.getElementById("rowsContainer");
      container.innerHTML = "";
      state.axes.forEach(function(axis){
        var block = document.createElement("div");
        block.className = "axis-block";
        var editor = document.createElement("div");
        editor.className = "axis-editor";
        var top = document.createElement("div");
        top.className = "axis-top";
        var wrap = document.createElement("div");
        wrap.className = "field";
        wrap.innerHTML = '<span class="lbl">軸：</span>';
        var num = document.createElement("input");
        num.type = "text";
        num.className = "axis-num";
        num.value = axis.number;
        num.title = "可自行修改軸編號";
        num.addEventListener("input", function(){ axis.number = num.value; renderPreview(); renderPhases(); });
        wrap.appendChild(num);
        top.appendChild(wrap);

        var moves = document.createElement("div");
        moves.className = "moves";
        if (!axis.moves.length){
          var empty = document.createElement("span");
          empty.className = "hint";
          empty.textContent = "尚未新增招式";
          moves.appendChild(empty);
        } else {
          axis.moves.forEach(function(m, i){
            var has = !!state.movePhase[moveKey(axis.id, i)];
            var tag = document.createElement("span");
            tag.className = "tag" + (isBasic(m) ? " basic" : "") + (has ? " has-phase" : "");
            tag.addEventListener("dragover", function(e){ e.preventDefault(); tag.classList.add("drop"); });
            tag.addEventListener("dragleave", function(){ tag.classList.remove("drop"); });
            tag.addEventListener("drop", function(e){
              e.preventDefault(); tag.classList.remove("drop");
              var pid = e.dataTransfer.getData("text/plain");
              if (pid) assignPhase(pid, axis.id, i);
            });
            tag.appendChild(document.createTextNode(m));
            var x = document.createElement("button");
            x.type = "button"; x.textContent = "×";
            x.addEventListener("click", function(){ removeMove(axis.id, i); });
            tag.appendChild(x);
            moves.appendChild(tag);
            if (i < axis.moves.length - 1){
              var ar = document.createElement("span");
              ar.className = "arrow"; ar.textContent = "›";
              moves.appendChild(ar);
            }
          });
        }
        top.appendChild(moves);
        editor.appendChild(top);

        var picker = document.createElement("div");
        picker.className = "picker";
        AXIS_MOVES.forEach(function(opt){
          var btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = opt;
          if (isBasic(opt)) btn.className = "basic";
          btn.addEventListener("click", function(){ addMove(axis.id, opt); });
          picker.appendChild(btn);
        });
        if (state.showCustom[axis.id]){
          var span = document.createElement("span");
          span.className = "field";
          var cin = document.createElement("input");
          cin.type = "text";
          cin.placeholder = "自訂名稱";
          cin.style.width = "96px";
          cin.style.height = "28px";
          cin.value = state.customDraft[axis.id] || "";
          cin.addEventListener("input", function(){ state.customDraft[axis.id] = cin.value; });
          cin.addEventListener("keydown", function(e){
            if (e.key === "Enter"){
              var name = (cin.value || "").trim();
              if (name){ addMove(axis.id, name); }
              state.customDraft[axis.id] = "";
              state.showCustom[axis.id] = false;
              renderEditor();
            }
          });
          var add = document.createElement("button");
          add.type = "button"; add.className = "btn btn-tiny"; add.textContent = "加入";
          add.addEventListener("click", function(){
            var name = (cin.value || "").trim();
            if (name) addMove(axis.id, name);
            state.customDraft[axis.id] = "";
            state.showCustom[axis.id] = false;
            renderEditor();
          });
          span.appendChild(cin); span.appendChild(add);
          picker.appendChild(span);
          setTimeout(function(){ cin.focus(); }, 0);
        } else {
          var custom = document.createElement("button");
          custom.type = "button";
          custom.className = "custom";
          custom.textContent = "自訂…";
          custom.addEventListener("click", function(){
            state.showCustom[axis.id] = true;
            renderEditor();
          });
          picker.appendChild(custom);
        }
        editor.appendChild(picker);
        block.appendChild(editor);

        var delWrap = document.createElement("div");
        delWrap.className = "axis-del";
        var del = document.createElement("button");
        del.type = "button";
        del.className = "btn-danger";
        del.textContent = "刪軸";
        del.addEventListener("click", function(){ removeAxis(axis.id); });
        delWrap.appendChild(del);
        block.appendChild(delWrap);
        container.appendChild(block);
      });
    }

    function chunkMoves(moves){
      var chunks = [], i = 0;
      while (i < moves.length){
        if (isBasic(moves[i])){
          var j = i;
          while (j < moves.length && isBasic(moves[j])) j++;
          chunks.push({ start:i, end:j, basic:true });
          i = j;
        } else {
          chunks.push({ start:i, end:i+1, basic:false });
          i++;
        }
      }
      return chunks;
    }

    function renderPreview(){
      var root = document.getElementById("preview-root");
      var o = state.opening;
      var html = "";
      var hasMeta = o.dungeonName.trim() || o.tiangong || (o.futie && o.futie !== "無") || o.xinfa || o.customTags.some(function(t){ return t.trim(); });
      if (hasMeta){
        html += '<div class="meta-row">';
        if (o.dungeonName.trim()) html += '<span class="chip dungeon">' + escapeHtml(o.dungeonName.trim()) + "</span>";
        if (o.tiangong) html += '<span class="chip">天工' + escapeHtml(o.tiangong) + "</span>";
        if (o.futie && o.futie !== "無") html += '<span class="chip">' + escapeHtml(o.futie) + "</span>";
        if (o.xinfa) html += '<span class="chip">' + escapeHtml(o.xinfa) + "</span>";
        o.customTags.forEach(function(t){
          if (t.trim()) html += '<span class="chip">' + escapeHtml(t.trim()) + "</span>";
        });
        html += "</div>";
      }
      if (o.countdownCount > 0){
        var label = (COUNTDOWN_OPTIONS.find(function(x){ return x.value === o.countdownCount; }) || {}).label || (o.countdownCount + "次");
        html += '<div class="cd-row"><span class="cd-count">';
        html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
        html += "<span>" + label + "</span></span><span>:</span>";
        o.countdownMoves.forEach(function(m){
          html += '<span style="display:inline-flex;align-items:center"><span class="cd-num">' + escapeHtml(m.count) + "</span>";
          html += '<span class="p-move' + (isBasic(m.name, COUNTDOWN_BASIC) ? " basic" : "") + '">' + escapeHtml(m.name) + "</span></span>";
        });
        html += "</div>";
      }
      state.axes.filter(function(a){ return a.moves.length; }).forEach(function(axis){
        html += '<div class="axis-preview" data-axis="' + axis.id + '">';
        html += '<div class="combo"><div class="p-num">' + escapeHtml(axis.number || "•") + "</div>";
        chunkMoves(axis.moves).forEach(function(ch, ci){
          html += '<span style="display:inline-flex;align-items:center;gap:8px">';
          html += '<span class="' + (ch.basic ? "basic-group" : "") + '" style="display:inline-flex;align-items:center;gap:' + (ch.basic ? "2px" : "8px") + '">';
          for (var k = ch.start; k < ch.end; k++){
            html += '<div class="p-move' + (ch.basic ? " basic" : "") + '" data-move="' + k + '">' + escapeHtml(axis.moves[k]) + "</div>";
          }
          html += "</span>";
          if (ch.end < axis.moves.length) html += '<span class="arrow">›</span>';
          html += "</span>";
        });
        html += "</div></div>";
      });
      root.innerHTML = html;

      root.querySelectorAll(".axis-preview").forEach(function(wrap){
        var axisId = wrap.getAttribute("data-axis");
        var axis = getAxis(axisId);
        if (!axis) return;
        var wrapRect = wrap.getBoundingClientRect();
        var items = [];
        axis.moves.forEach(function(_, i){
          var pid = state.movePhase[moveKey(axisId, i)];
          var text = pid && getPhase(pid) ? getPhase(pid).text.trim() : "";
          if (!text) return;
          var el = wrap.querySelector('.p-move[data-move="' + i + '"]');
          if (!el) return;
          var r = el.getBoundingClientRect();
          var probe = document.createElement("span");
          probe.className = "p-phase";
          probe.textContent = text;
          probe.style.visibility = "hidden";
          wrap.appendChild(probe);
          var w = probe.getBoundingClientRect().width;
          wrap.removeChild(probe);
          items.push({ text: text, left: r.left - wrapRect.left, width: w });
        });
        var lanes = assignLanes(items);
        var maxLane = items.length ? Math.max.apply(null, lanes) : 0;
        var PHASE_H = 16;
        var pad = items.length ? (maxLane + 1) * PHASE_H + 2 : 0;
        wrap.style.paddingTop = pad + "px";
        items.forEach(function(it, i){
          var el = document.createElement("div");
          el.className = "p-phase";
          el.textContent = it.text;
          el.style.left = it.left + "px";
          el.style.top = (pad - ((lanes[i] || 0) + 1) * PHASE_H) + "px";
          wrap.appendChild(el);
        });
      });
    }

    /* ---------- PNG export ---------- */
    function roundRect(ctx,x,y,w,h,r){
      r = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+h,r);
      ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r);
      ctx.arcTo(x,y,x+w,y,r);
      ctx.closePath();
    }
    function fillChip(ctx,text,x,y,font,bg,fg,border,padX,padY){
      padX = padX == null ? 8 : padX;
      padY = padY == null ? 5 : padY;
      ctx.font = font;
      var m = ctx.measureText(text);
      var tw = Math.ceil(m.width);
      var th = Math.max(12, Math.ceil((m.actualBoundingBoxAscent || 10) + (m.actualBoundingBoxDescent || 3)));
      var w = tw + padX*2, h = th + padY*2;
      roundRect(ctx,x,y,w,h,4);
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = fg; ctx.textBaseline = "middle"; ctx.textAlign = "left";
      ctx.fillText(text, x+padX, y+h/2+0.5);
      return { w:w, h:h };
    }
    function drawClock(ctx,x,y,size){
      var cx = x+size/2, cy = y+size/2;
      ctx.strokeStyle = C.cd; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(cx,cy,size/2-1.5,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx, cy-size/4);
      ctx.moveTo(cx,cy); ctx.lineTo(cx+size/5, cy+size/8); ctx.stroke();
    }
    function renderPreviewCanvas(){
      var measure = document.createElement("canvas").getContext("2d");
      var axes = state.axes.filter(function(a){ return a.moves.length; });
      var opening = state.opening;
      var chipH = 22, moveH = 26, axisN = 26, phaseH = 15, pad = 12, gap = 6;
      var chips = [];
      if (opening.dungeonName.trim()) chips.push({ text: opening.dungeonName.trim(), bg:C.dungeon, fg:C.dungeonFg, border:C.dungeonEdge });
      if (opening.tiangong) chips.push({ text: "天工"+opening.tiangong, bg:C.elevated, fg:C.muted, border:C.line });
      if (opening.futie && opening.futie !== "無") chips.push({ text: opening.futie, bg:C.elevated, fg:C.muted, border:C.line });
      if (opening.xinfa) chips.push({ text: opening.xinfa, bg:C.elevated, fg:C.muted, border:C.line });
      opening.customTags.forEach(function(t){
        if (t.trim()) chips.push({ text: t.trim(), bg:C.elevated, fg:C.muted, border:C.line });
      });
      measure.font = FONT_SM;
      var metaW = 0;
      chips.forEach(function(c,i){ metaW += Math.ceil(measure.measureText(c.text).width) + 16 + (i?gap:0); });
      var cdW = 0;
      if (opening.countdownCount > 0){
        var label = (COUNTDOWN_OPTIONS.find(function(x){ return x.value === opening.countdownCount; }) || {}).label || (opening.countdownCount+"次");
        cdW = 18 + 8 + Math.ceil(measure.measureText(label).width) + 16 + 14;
        opening.countdownMoves.forEach(function(m){
          measure.font = FONT_XS;
          var nw = Math.ceil(measure.measureText(m.count).width);
          measure.font = FONT;
          cdW += 8 + nw + 4 + Math.ceil(measure.measureText(m.name).width) + 16;
        });
      }
      var axisLayouts = axes.map(function(axis){
        var chunks = chunkMoves(axis.moves);
        measure.font = FONT;
        var moveW = axis.moves.map(function(name){ return Math.ceil(measure.measureText(name).width) + 16; });
        var lefts = [];
        var x = axisN + 8;
        chunks.forEach(function(ch, ci){
          var innerGap = ch.basic ? 2 : 8;
          for (var i = ch.start; i < ch.end; i++){
            lefts[i] = x;
            x += moveW[i] + (i < ch.end - 1 ? innerGap : 0);
          }
          if (ci < chunks.length - 1) x += 18;
        });
        var items = [];
        axis.moves.forEach(function(_, i){
          var pid = state.movePhase[moveKey(axis.id, i)];
          var text = pid && getPhase(pid) ? getPhase(pid).text.trim() : "";
          if (!text) return;
          measure.font = FONT_SM;
          items.push({ text:text, left:lefts[i], width: Math.ceil(measure.measureText(text).width)+16 });
        });
        var lanes = assignLanes(items);
        var placed = items.map(function(it,i){ return { text:it.text, left:it.left, width:it.width, lane: lanes[i]||0 }; });
        var maxLane = placed.length ? Math.max.apply(null, placed.map(function(p){ return p.lane; })) : -1;
        var phasePad = maxLane >= 0 ? (maxLane+1)*(phaseH+2) : 0;
        return { axis:axis, chunks:chunks, moveW:moveW, lefts:lefts, rowW:x, placed:placed, phasePad:phasePad };
      });
      var contentW = Math.max(metaW, cdW, 40);
      axisLayouts.forEach(function(a){ if (a.rowW > contentW) contentW = a.rowW; });
      var contentH = 0;
      if (chips.length) contentH += chipH + 10;
      if (opening.countdownCount > 0) contentH += 28 + 10;
      axisLayouts.forEach(function(a,i){ contentH += a.phasePad + moveH + (i < axisLayouts.length-1 ? 2 : 0); });
      if (!contentH) contentH = 40;
      var W = Math.ceil(contentW + pad*2), H = Math.ceil(contentH + pad*2), scale = 2;
      var canvas = document.createElement("canvas");
      canvas.width = W*scale; canvas.height = H*scale;
      var ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      ctx.textBaseline = "middle"; ctx.textAlign = "left";
      var y = pad, x = pad;
      if (chips.length){
        x = pad;
        chips.forEach(function(c){
          var r = fillChip(ctx, c.text, x, y, FONT_SM, c.bg, c.fg, c.border);
          x += r.w + gap;
        });
        y += chipH + 10;
      }
      if (opening.countdownCount > 0){
        x = pad;
        var label2 = (COUNTDOWN_OPTIONS.find(function(o){ return o.value === opening.countdownCount; }) || {}).label || (opening.countdownCount+"次");
        ctx.font = FONT_SM;
        var lw = Math.ceil(ctx.measureText(label2).width);
        var boxW = 18+8+lw+16, boxH = 24;
        roundRect(ctx,x,y,boxW,boxH,6);
        ctx.fillStyle = C.elevated; ctx.fill();
        ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.stroke();
        drawClock(ctx, x+6, y+4, 16);
        ctx.fillStyle = C.fg; ctx.font = FONT_SM;
        ctx.fillText(label2, x+26, y+boxH/2+0.5);
        x += boxW + 8;
        ctx.fillStyle = C.fg; ctx.font = FONT;
        ctx.fillText(":", x, y+boxH/2+0.5);
        x += 12;
        opening.countdownMoves.forEach(function(m){
          ctx.font = FONT_XS; ctx.fillStyle = C.cd;
          var nw = Math.ceil(ctx.measureText(m.count).width);
          ctx.fillText(m.count, x, y+boxH/2+0.5);
          x += nw + 3;
          var basic = isBasic(m.name, COUNTDOWN_BASIC);
          var r = fillChip(ctx, m.name, x, y+1, FONT, basic?C.basic:C.elevated, C.fg, basic?C.basicEdge:C.line, 8, 5);
          x += r.w + 8;
        });
        y += 28 + 10;
      }
      axisLayouts.forEach(function(layout, i){
        y += layout.phasePad;
        var rowY = y;
        x = pad;
        roundRect(ctx, x, rowY, axisN, axisN, 4);
        ctx.fillStyle = C.axis; ctx.fill();
        ctx.fillStyle = C.fg; ctx.font = FONT_XS; ctx.textAlign = "center";
        ctx.fillText(layout.axis.number || "•", x+axisN/2, rowY+axisN/2+0.5);
        ctx.textAlign = "left";
        layout.axis.moves.forEach(function(name, mi){
          var basic = isBasic(name);
          fillChip(ctx, name, pad+layout.lefts[mi], rowY+(axisN-moveH)/2, FONT, basic?C.basic:C.elevated, C.fg, basic?C.basicEdge:C.line, 8, 6);
        });
        layout.chunks.forEach(function(ch, ci){
          if (ci === layout.chunks.length-1) return;
          var last = ch.end-1;
          var x1 = pad + layout.lefts[last] + layout.moveW[last];
          var x2 = pad + layout.lefts[ch.end];
          ctx.fillStyle = C.subtle; ctx.font = FONT; ctx.textAlign = "center";
          ctx.fillText("›", (x1+x2)/2, rowY+axisN/2+0.5);
          ctx.textAlign = "left";
        });
        layout.placed.forEach(function(p){
          fillChip(ctx, p.text, pad+p.left, rowY-(p.lane+1)*(phaseH+2), FONT_SM, C.phase, C.phaseFg, C.phase, 8, 2);
        });
        y += moveH + (i < axisLayouts.length-1 ? 2 : 0);
      });
      return canvas;
    }

    function downloadPng(){
      var err = document.getElementById("exportErr");
      err.textContent = "";
      try {
        var canvas = renderPreviewCanvas();
        var a = document.createElement("a");
        var base = state.opening.dungeonName.trim() || "燕雲排軸";
        a.download = base.replace(/[\\/:*?"<>|]+/g,"_").slice(0,40) + ".png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      } catch (e) {
        err.textContent = "匯出失敗，請再試一次";
      }
    }

    /* ---------- bind ---------- */
    document.getElementById("dungeonName").addEventListener("input", function(e){
      state.opening.dungeonName = e.target.value; renderPreview();
    });
    document.getElementById("tiangong").addEventListener("change", function(e){
      state.opening.tiangong = e.target.value; renderPreview();
    });
    document.getElementById("futie").addEventListener("change", function(e){
      state.opening.futie = e.target.value; renderPreview();
    });
    document.getElementById("xinfa").addEventListener("change", function(e){
      state.opening.xinfa = e.target.value; renderPreview();
    });
    function renderCustomTags(){
      var box = document.getElementById("customTagFields");
      box.innerHTML = "";
      state.opening.customTags.forEach(function(t, i){
        var wrap = document.createElement("span");
        wrap.className = "field";
        var input = document.createElement("input");
        input.type = "text";
        input.placeholder = "自定標籤";
        input.value = t;
        input.style.width = "112px";
        input.addEventListener("input", function(){
          state.opening.customTags[i] = input.value;
          renderPreview();
        });
        var del = document.createElement("button");
        del.type = "button";
        del.className = "btn-danger btn-tiny";
        del.textContent = "×";
        del.addEventListener("click", function(){
          state.opening.customTags.splice(i, 1);
          renderCustomTags();
          renderPreview();
        });
        wrap.appendChild(input);
        wrap.appendChild(del);
        box.appendChild(wrap);
      });
    }
    document.getElementById("btnAddTag").addEventListener("click", function(){
      state.opening.customTags.push("");
      renderCustomTags();
      var inputs = document.querySelectorAll("#customTagFields input");
      if (inputs.length) inputs[inputs.length - 1].focus();
    });
    document.getElementById("countdownCount").addEventListener("change", function(e){
      var v = Number(e.target.value);
      state.opening.countdownCount = v;
      if (v === 0) state.opening.countdownMoves = [];
      renderCountdown(); renderPreview();
    });
    document.getElementById("countdownEditor").addEventListener("click", function(e){
      var t = e.target;
      if (t.dataset.addcd) addCountdownMove(t.dataset.addcd);
      if (t.dataset.rmcd != null) removeCountdownMove(Number(t.dataset.rmcd));
    });
    document.getElementById("countdownEditor").addEventListener("input", function(e){
      var t = e.target;
      if (t.dataset.cd != null){
        var i = Number(t.dataset.cd);
        if (state.opening.countdownMoves[i]) state.opening.countdownMoves[i].count = t.value;
        renderPreview();
      }
    });
    document.getElementById("btnAddPhase").addEventListener("click", addPhase);
    document.getElementById("btnAddRow").addEventListener("click", addAxis);
    document.getElementById("btnDownload").addEventListener("click", downloadPng);

    renderCustomTags();
    renderPhases();
    renderEditor();
    renderPreview();
  </script>
